<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>설문 집계기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #d9dde4; --accent: #2f5bd3; --accent-text: #ffffff; --zebra: #f3f5f8;
    --warn-bg: #fff6df; --warn-line: #e8c56a; --err-bg: #fdecec; --err-line: #e2a0a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e; --panel: #1d2129; --text: #e6e9ef; --muted: #9aa3b2;
      --line: #343a46; --accent: #7a9cff; --accent-text: #0e1320; --zebra: #222731;
      --warn-bg: #3a311a; --warn-line: #7d6526; --err-bg: #3d2020; --err-line: #7c3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 200px; resize: vertical; padding: 10px;
    font: 0.9rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    tab-size: 8; white-space: pre; overflow: auto;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .notice { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid; }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .notice.error { background: var(--err-bg); border-color: var(--err-line); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: pre-wrap; min-width: 8em; }
  thead th { font-weight: 600; border-bottom-width: 2px; }
  tbody tr:nth-child(even) { background: var(--zebra); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>설문 집계기</h1>
  <p class="muted">붙여넣은 데이터는 이 브라우저 안에서만 계산하며, 어디에도 보내거나 저장하지 않습니다.</p>

  <section>
    <label for="input">엑셀에서 머리글 줄까지 복사해 붙여넣으세요</label>
    <textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      placeholder="응답번호&#9;Q1&#9;Q2&#10;1&#9;5&#9;4&#10;2&#9;3&#9;"></textarea>
    <div class="actions">
      <button type="button" id="run" class="primary">집계</button>
      <button type="button" id="clear">지우기</button>
    </div>
    <p class="muted" style="margin:10px 0 0">
      첫 열(응답번호)은 집계하지 않습니다. 앞뒤 공백을 지운 값이 1~5면 유효, 비었거나 공백만 있으면 빈 응답,
      그 밖의 값은 제외로 셉니다. 칸이 모자란 줄은 모자란 칸을 빈 응답으로 셉니다.
    </p>
  </section>

  <section id="output" hidden aria-live="polite">
    <h2>문항별 결과</h2>
    <div id="message"></div>
    <p id="summary" class="muted"></p>
    <div class="table-wrap">
      <table id="result" hidden>
        <thead>
          <tr><th scope="col">문항</th><th scope="col">유효 응답</th><th scope="col">평균</th><th scope="col">빈 응답</th><th scope="col">제외</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script id="tally-core">
/* 계산 로직: 화면(DOM)을 건드리지 않는 순수 함수만 둔다. tests/에서 이 스크립트를 그대로 뽑아 시험한다. */
(function (root) {
  'use strict';

  function isLineBreak(c) { return c === '\n' || c === '\r'; }

  function lineBreakLength(text, i) {
    return text[i] === '\r' && text[i + 1] === '\n' ? 2 : 1;
  }

  // 칸 하나를 읽어 [값, 다음 위치]를 돌려준다.
  // 엑셀은 칸 안에 줄바꿈·탭·따옴표가 있으면 "..."로 감싸고 안의 "는 ""로 적는다.
  // 따옴표로 시작했지만 그 형식이 아니면 따옴표까지 글자 그대로 읽는다.
  function readField(text, start) {
    var n = text.length;
    if (text[start] === '"') {
      var buf = '';
      var j = start + 1;
      while (j < n) {
        var c = text[j];
        if (c === '"') {
          if (text[j + 1] === '"') { buf += '"'; j += 2; continue; }
          j += 1;
          if (j >= n || text[j] === '\t' || isLineBreak(text[j])) return [buf, j];
          break; // 닫는 따옴표 뒤에 다른 글자 → 따옴표 형식이 아님
        }
        buf += c;
        j += 1;
      }
    }
    var k = start;
    while (k < n && text[k] !== '\t' && !isLineBreak(text[k])) k += 1;
    return [text.slice(start, k), k];
  }

  // 탭으로 나뉜 글을 줄(칸 배열)의 배열로 바꾼다. 글자가 하나도 없는 줄은 건너뛴다.
  function parseTable(text) {
    text = String(text == null ? '' : text);
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    var rows = [];
    var n = text.length;
    var i = 0;
    while (i < n) {
      if (isLineBreak(text[i])) { i += lineBreakLength(text, i); continue; }
      var row = [];
      for (;;) {
        var r = readField(text, i);
        row.push(r[0]);
        i = r[1];
        if (i >= n) break;
        if (text[i] === '\t') { i += 1; continue; }
        i += lineBreakLength(text, i);
        break;
      }
      rows.push(row);
    }
    return rows;
  }

  // 'valid' | 'blank' | 'excluded'. 칸이 아예 없으면(undefined) 빈 응답.
  function classifyCell(value) {
    if (value == null) return 'blank';
    var t = String(value).trim();
    if (t === '') return 'blank';
    if (/^[1-5]$/.test(t)) return 'valid';
    return 'excluded';
  }

  // sum ÷ count를 소수 셋째 자리에서 반올림해 둘째 자리까지. 정수 연산으로 부동소수 오차를 피한다.
  function formatAverage(sum, count) {
    if (!count) return '-';
    var hundredths = Math.floor((200 * sum + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  }

  function tally(text) {
    var rows = parseTable(text);
    if (rows.length === 0) return { ok: false, error: 'empty' };
    var header = rows[0];
    if (header.length < 2) return { ok: false, error: 'no-questions' };

    var questions = [];
    for (var c = 1; c < header.length; c += 1) {
      var name = String(header[c]).trim();
      questions.push({
        name: name === '' ? '(이름 없음 ' + (c + 1) + '열)' : name,
        valid: 0, sum: 0, blank: 0, excluded: 0, average: '-'
      });
    }

    var extraCellRows = 0;
    for (var r = 1; r < rows.length; r += 1) {
      var row = rows[r];
      if (row.length > header.length) extraCellRows += 1;
      for (var q = 0; q < questions.length; q += 1) {
        var cell = row[q + 1];
        var kind = classifyCell(cell);
        var stat = questions[q];
        if (kind === 'valid') { stat.valid += 1; stat.sum += Number(String(cell).trim()); }
        else if (kind === 'blank') stat.blank += 1;
        else stat.excluded += 1;
      }
    }
    for (var s = 0; s < questions.length; s += 1) {
      questions[s].average = formatAverage(questions[s].sum, questions[s].valid);
    }
    return { ok: true, responseCount: rows.length - 1, extraCellRows: extraCellRows, questions: questions };
  }

  var api = { parseTable: parseTable, classifyCell: classifyCell, formatAverage: formatAverage, tally: tally };
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  else root.SurveyTally = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script id="tally-ui">
/* 화면: 입력을 읽어 SurveyTally.tally를 부르고 결과를 그린다. 글자는 모두 textContent로 넣는다. */
(function () {
  'use strict';
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var message = document.getElementById('message');
  var summary = document.getElementById('summary');
  var table = document.getElementById('result');
  var tbody = table.tBodies[0];

  var ERRORS = {
    'empty': '붙여넣은 내용이 없습니다.',
    'no-questions': '머리글에 문항 열이 없습니다. 첫 열(응답번호) 다음에 문항 열이 있어야 합니다.'
  };

  function notice(kind, text) {
    var div = document.createElement('div');
    div.className = 'notice ' + kind;
    div.textContent = text;
    message.appendChild(div);
  }

  function cell(tag, text) {
    var el = document.createElement(tag);
    el.textContent = text;
    return el;
  }

  function render() {
    var result = SurveyTally.tally(input.value);
    message.textContent = '';
    summary.textContent = '';
    tbody.textContent = '';
    output.hidden = false;

    if (!result.ok) {
      table.hidden = true;
      notice('error', ERRORS[result.error] || '집계하지 못했습니다.');
      return;
    }
    if (result.responseCount === 0) notice('warn', '머리글 아래에 응답 줄이 없습니다.');
    if (result.extraCellRows > 0) {
      notice('warn', '머리글보다 칸이 많은 줄이 ' + result.extraCellRows + '개 있습니다. 남는 칸은 집계하지 않았습니다.');
    }
    summary.textContent = '응답 ' + result.responseCount + '줄 · 문항 ' + result.questions.length + '개';

    result.questions.forEach(function (q) {
      var tr = document.createElement('tr');
      tr.appendChild(cell('th', q.name)).setAttribute('scope', 'row');
      tr.appendChild(cell('td', String(q.valid)));
      tr.appendChild(cell('td', q.average));
      tr.appendChild(cell('td', String(q.blank)));
      tr.appendChild(cell('td', String(q.excluded)));
      tbody.appendChild(tr);
    });
    table.hidden = false;
  }

  document.getElementById('run').addEventListener('click', render);
  input.addEventListener('paste', function () { setTimeout(render, 0); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); render(); }
  });
  document.getElementById('clear').addEventListener('click', function () {
    input.value = '';
    message.textContent = '';
    summary.textContent = '';
    tbody.textContent = '';
    table.hidden = true;
    output.hidden = true;
    input.focus();
  });
})();
</script>
</body>
</html>
