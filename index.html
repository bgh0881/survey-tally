<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 집계기</title>
</head>
<body>
<script id="tally-core">
/* 계산 로직: 화면(DOM)을 건드리지 않는 순수 함수만 둔다. tests/에서 이 스크립트를 그대로 뽑아 시험한다. */
(function (root) {
  'use strict';

  function isLineBreak(c) { return c === '\n' || c === '\r'; }

  function lineBreakLength(text, i) {
    return text[i] === '\r' && text[i + 1] === '\n' ? 2 : 1;
  }

  // 칸 하나를 읽어 [값, 다음 위치]를 돌려준다.
  // 엑셀은 칸 안에 줄바꿈·탭·따옴표가 있으면 "..."로 감싸고 안의 "는 ""로 적는다.
  // 따옴표로 시작했지만 그 형식이 아니면 따옴표까지 글자 그대로 읽는다.
  function readField(text, start) {
    var n = text.length;
    if (text[start] === '"') {
      var buf = '';
      var j = start + 1;
      while (j < n) {
        var c = text[j];
        if (c === '"') {
          if (text[j + 1] === '"') { buf += '"'; j += 2; continue; }
          j += 1;
          if (j >= n || text[j] === '\t' || isLineBreak(text[j])) return [buf, j];
          break; // 닫는 따옴표 뒤에 다른 글자 → 따옴표 형식이 아님
        }
        buf += c;
        j += 1;
      }
    }
    var k = start;
    while (k < n && text[k] !== '\t' && !isLineBreak(text[k])) k += 1;
    return [text.slice(start, k), k];
  }

  // 탭으로 나뉜 글을 줄(칸 배열)의 배열로 바꾼다. 글자가 하나도 없는 줄은 건너뛴다.
  function parseTable(text) {
    text = String(text == null ? '' : text);
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    var rows = [];
    var n = text.length;
    var i = 0;
    while (i < n) {
      if (isLineBreak(text[i])) { i += lineBreakLength(text, i); continue; }
      var row = [];
      for (;;) {
        var r = readField(text, i);
        row.push(r[0]);
        i = r[1];
        if (i >= n) break;
        if (text[i] === '\t') { i += 1; continue; }
        i += lineBreakLength(text, i);
        break;
      }
      rows.push(row);
    }
    return rows;
  }

  // 'valid' | 'blank' | 'excluded'. 칸이 아예 없으면(undefined) 빈 응답.
  function classifyCell(value) {
    if (value == null) return 'blank';
    var t = String(value).trim();
    if (t === '') return 'blank';
    if (/^[1-5]$/.test(t)) return 'valid';
    return 'excluded';
  }

  // sum ÷ count를 소수 셋째 자리에서 반올림해 둘째 자리까지. 정수 연산으로 부동소수 오차를 피한다.
  function formatAverage(sum, count) {
    if (!count) return '-';
    var hundredths = Math.floor((200 * sum + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  }

  function tally(text) {
    var rows = parseTable(text);
    if (rows.length === 0) return { ok: false, error: 'empty' };
    var header = rows[0];
    if (header.length < 2) return { ok: false, error: 'no-questions' };

    var questions = [];
    for (var c = 1; c < header.length; c += 1) {
      var name = String(header[c]).trim();
      questions.push({
        name: name === '' ? '(이름 없음 ' + (c + 1) + '열)' : name,
        valid: 0, sum: 0, blank: 0, excluded: 0, average: '-'
      });
    }

    var extraCellRows = 0;
    for (var r = 1; r < rows.length; r += 1) {
      var row = rows[r];
      if (row.length > header.length) extraCellRows += 1;
      for (var q = 0; q < questions.length; q += 1) {
        var cell = row[q + 1];
        var kind = classifyCell(cell);
        var stat = questions[q];
        if (kind === 'valid') { stat.valid += 1; stat.sum += Number(String(cell).trim()); }
        else if (kind === 'blank') stat.blank += 1;
        else stat.excluded += 1;
      }
    }
    for (var s = 0; s < questions.length; s += 1) {
      questions[s].average = formatAverage(questions[s].sum, questions[s].valid);
    }
    return { ok: true, responseCount: rows.length - 1, extraCellRows: extraCellRows, questions: questions };
  }

  var api = { parseTable: parseTable, classifyCell: classifyCell, formatAverage: formatAverage, tally: tally };
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  else root.SurveyTally = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
